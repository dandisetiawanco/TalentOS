services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentos_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-talentos}
    ports:
      - "5432:5432"
    volumes:
      - talentos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentos} -d ${POSTGRES_DB:-talentos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-talentos}:${POSTGRES_PASSWORD:-talentos_local_dev}@postgres:5432/${POSTGRES_DB:-talentos}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-jwt-secret-change-in-production-32chars}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-local-compose-signed-url-secret-change-in-prod}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - talentos_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      API_INTERNAL_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  talentos_pgdata:
  talentos_storage:
