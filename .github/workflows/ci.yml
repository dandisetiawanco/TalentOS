name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Tests (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentos
          POSTGRES_PASSWORD: talentos_ci_password
          POSTGRES_DB: talentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: apps/api
        run: ruff check app tests
      - name: Run Alembic migrations against PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://talentos:talentos_ci_password@localhost:5432/talentos_test
          JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters-long
          SIGNED_URL_SECRET: ci-only-signed-url-secret-key-at-least-32-chars
        run: alembic upgrade head
      - name: Run pytest suite against PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://talentos:talentos_ci_password@localhost:5432/talentos_test
          TEST_DATABASE_URL: postgresql+psycopg://talentos:talentos_ci_password@localhost:5432/talentos_test
          JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters-long
          SIGNED_URL_SECRET: ci-only-signed-url-secret-key-at-least-32-chars
        run: pytest -v

  frontend:
    name: Frontend Typecheck, Lint, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Typecheck packages and app
        run: pnpm typecheck
      - name: Lint frontend
        run: pnpm lint
      - name: Run Vitest unit tests
        run: pnpm test:web
      - name: Verify production Next.js build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: pnpm build
