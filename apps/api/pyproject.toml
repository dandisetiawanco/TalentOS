[project]
name = "talentos-api"
version = "1.0.0"
description = "TalentOS FastAPI backend service"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.6,<0.116.0",
    "uvicorn[standard]>=0.32.1,<0.35.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "alembic>=1.14.0,<1.16.0",
    "psycopg[binary]>=3.2.3,<3.3.0",
    "pydantic>=2.10.3,<2.12.0",
    "pydantic-settings>=2.7.0,<2.9.0",
    "email-validator>=2.2.0,<2.3.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "PyJWT>=2.10.1,<2.11.0",
    "python-multipart>=0.0.20,<0.1.0",
    "PyMuPDF>=1.25.1,<1.26.0",
    "python-docx>=1.1.2,<1.2.0",
    "httpx>=0.28.1,<0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.26.0",
    "ruff>=0.8.4,<0.10.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
