<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="ogGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F2F4F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#F2F4F6"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Main Liquid Glass inspired frame -->
  <rect x="44" y="42" width="1112" height="546" rx="22" fill="#FFFFFF" fill-opacity="0.88" stroke="#18201E" stroke-opacity="0.09" stroke-width="1.5"/>
  <line x1="44" y1="118" x2="1156" y2="118" stroke="#18201E" stroke-opacity="0.08"/>

  <!-- Brand -->
  <g transform="translate(84, 67)">
    <rect x="0" y="2" width="26" height="5.5" rx="1.4" fill="#18201E"/>
    <rect x="7" y="12" width="10.5" height="5.5" rx="1.4" fill="#18201E"/>
    <rect x="10.5" y="17.5" width="5.5" height="9" rx="1.4" fill="#18201E"/>
    <rect x="20.5" y="12" width="5.5" height="5.5" rx="1.4" fill="#247A60"/>
    <text x="40" y="22" fill="#18201E" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.03em">Talent<tspan fill="#247A60">OS</tspan></text>
  </g>
  <text x="1116" y="88" text-anchor="end" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Recruitment workspace</text>

  <!-- Left copy -->
  <text x="84" y="246" fill="#18201E" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="600" letter-spacing="-0.038em">A better way</text>
  <text x="84" y="312" fill="#247A60" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="600" letter-spacing="-0.038em">to hire.</text>
  <text x="84" y="374" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20">Bring your hiring team, candidates,</text>
  <text x="84" y="404" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20">and recruitment workflows together</text>
  <text x="84" y="434" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20">in one thoughtful workspace.</text>

  <!-- Right workspace preview card -->
  <g transform="translate(720, 162)">
    <rect width="396" height="330" rx="16" fill="#F7F9FA" stroke="#18201E" stroke-opacity="0.09" stroke-width="1.2"/>
    <text x="22" y="34" fill="#18201E" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Hiring pipeline</text>
    <text x="374" y="34" text-anchor="end" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">7 stages</text>
    <line x1="22" y1="48" x2="374" y2="48" stroke="#18201E" stroke-opacity="0.08"/>

    <rect x="22" y="64" width="352" height="58" rx="11" fill="#FFFFFF" stroke="#18201E" stroke-opacity="0.08"/>
    <circle cx="40" cy="85" r="4" fill="#247A60"/>
    <text x="52" y="89" fill="#18201E" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600">Nadia Kusuma</text>
    <text x="40" y="109" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Staff Frontend Engineer · Interview</text>

    <rect x="22" y="134" width="352" height="58" rx="11" fill="#FFFFFF" stroke="#18201E" stroke-opacity="0.08"/>
    <circle cx="40" cy="155" r="4" fill="#2D5D8C"/>
    <text x="52" y="159" fill="#18201E" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600">Raka Pratama</text>
    <text x="40" y="179" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Senior Backend Engineer · Shortlisted</text>

    <rect x="22" y="204" width="352" height="58" rx="11" fill="#FFFFFF" stroke="#18201E" stroke-opacity="0.08"/>
    <circle cx="40" cy="225" r="4" fill="#9A3C07"/>
    <text x="52" y="229" fill="#18201E" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600">Siti Rahmawati</text>
    <text x="40" y="249" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Product Designer · Offer extended</text>

    <rect x="22" y="274" width="352" height="38" rx="10" fill="#E7F4EE"/>
    <text x="198" y="297" text-anchor="middle" fill="#1D6650" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500">Evidence-first review · Human-led hiring decisions</text>
  </g>

  <line x1="84" y1="528" x2="1116" y2="528" stroke="#18201E" stroke-opacity="0.08"/>
  <text x="84" y="562" fill="#626D68" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5">Designed and built by Dandi Setiawan</text>
  <text x="1116" y="562" text-anchor="end" fill="#247A60" font-family="Geist, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="500">dandisetiawan.id</text>
</svg>
